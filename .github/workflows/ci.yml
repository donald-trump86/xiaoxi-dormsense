name: Repository checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            services/bridge/requirements.txt
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt -r services/bridge/requirements.txt
      - name: Validate documentation and contracts
        run: python scripts/check_repository.py
      - name: Run offline tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run bridge boundary tests with synthetic fixtures
        run: python -m unittest discover -s services/bridge/tests -p 'test_*.py'
      - name: Run bounded history and estimation tests with synthetic fixtures
        run: python -m unittest discover -s analytics/tests -p 'test_*.py'
      - name: Validate legacy Compose structure without starting services
        run: docker compose -f deploy/compose.yaml config --quiet
      - name: Validate standalone formal Compose with public placeholders
        run: docker compose --env-file deploy/secure.env.example -f deploy/compose.secure.yaml config --quiet
