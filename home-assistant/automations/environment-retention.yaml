# Only environment state history; unrelated entities keep their existing policy.
# Queries use a strict 24h window. Physical purge can lag by 5min plus queue time.
- id: xiaoxi_environment_24h_retention
  alias: "XiaoXi environment history: rolling day"
  initial_state: true
  mode: single
  triggers:
    - trigger: time_pattern
      minutes: "/5"
      seconds: 0
    - trigger: homeassistant
      event: start
  actions:
    - action: recorder.purge_entities
      data:
        entity_id:
          - sensor.xiaoxi_node01_humidity
          - sensor.xiaoxi_node01_light
          - sensor.xiaoxi_node01_temperature
        keep_days: 1
