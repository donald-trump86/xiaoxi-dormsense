[platformio]
default_envs = native

[env:native]
platform = platformio/native@1.2.1
test_framework = unity
test_build_src = false
test_filter = test_*
lib_deps = throwtheswitch/Unity@2.6.1
build_flags = -std=c++11 -Wall -Wextra -Werror

[env:uno_r4_wifi]
platform = platformio/renesas-ra@1.9.0
board = uno_r4_wifi
framework = arduino
platform_packages = platformio/framework-arduinorenesas-uno@1.6.0
monitor_speed = 115200
build_flags = -Wl,-u,_printf_float
lib_deps = knolleary/PubSubClient@2.8.0
test_ignore = test_*

; Explicit opt-in fixture: disconnects THIS UNO from Wi-Fi for 45 seconds.
[env:uno_r4_wifi_outage_test]
extends = env:uno_r4_wifi
build_flags = ${env:uno_r4_wifi.build_flags} -DXIAOXI_WIFI_OUTAGE_TEST
