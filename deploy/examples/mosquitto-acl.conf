# New-install baseline. No anonymous clients, wildcard write, or HA command publisher.
user xiaoxi_node01
topic write xiaoxi/dorm/node01/telemetry
topic write xiaoxi/dorm/node01/status
topic write xiaoxi/dorm/node01/event

user xiaoxi_node02
topic write xiaoxi/dorm/node02/status
topic write xiaoxi/dorm/node02/event
topic read xiaoxi/dorm/node02/command

user xiaoxi_validator
topic read xiaoxi/dorm/node01/telemetry
topic read xiaoxi/dorm/node01/status
topic write xiaoxi/validated/node01/telemetry
topic write xiaoxi/validated/node01/status

user xiaoxi_ha_read
topic read xiaoxi/validated/node01/telemetry
topic read xiaoxi/validated/node01/status
topic read xiaoxi/dorm/node01/event
topic read xiaoxi/dorm/node02/status
topic read xiaoxi/dorm/node02/event

# Optional synthetic node90 development, distinct from real boards.
user xiaoxi_dev
topic write xiaoxi/dorm/node90/telemetry
topic write xiaoxi/dorm/node90/status
topic read xiaoxi/dorm/node90/telemetry
topic read xiaoxi/dorm/node90/status

# No command write grant is shipped. A human operator grant requires a separate review.
# The firmware still supports ac_send; this ACL is not a firmware disarm mechanism.
