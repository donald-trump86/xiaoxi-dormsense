# Copy only into a NEW private broker config directory; provision all referenced files.
persistence true
persistence_location /mosquitto/data/
log_dest stdout
per_listener_settings true

# Host publication stays loopback; internal HA uses this authenticated listener.
listener 1883
allow_anonymous false
password_file /mosquitto/private/passwords
acl_file /mosquitto/private/acl

# Certificate SAN must match BOTH the internal mosquitto name and the chosen LAN IP.
listener 8883
allow_anonymous false
password_file /mosquitto/private/passwords
acl_file /mosquitto/private/acl
cafile /mosquitto/private/ca.crt
certfile /mosquitto/private/server.crt
keyfile /mosquitto/private/server.key
tls_version tlsv1.2
