-width="5" fill="none"/><path d="M805,438 L814.0342795743205,451.2053698385549" stroke="#005AA6" stroke-width="5" fill="none"/><path d="M805,438 L795.9657204256795,451.2053698385549" stroke="#005AA6" stroke-width="5" fill="none"/><text x="870" y="518" fill="#005AA6" font-family="Microsoft YaHei" font-size="27" font-weight="700" text-anchor="start"><tspan x="870" dy="0">温度 / 湿度 / 光照等结构化结果返回模型</tspan></text><path d="M805,552 L805,620" stroke="#005AA6" stroke-width="5" fill="none"/><path d="M805,620 L795.9657204256795,606.7946301614452" stroke="#005AA6" stroke-width="5" fill="none"/><path d="M805,620 L814.0342795743205,606.7946301614452" stroke="#005AA6" stroke-width="5" fill="none"/><rect x="590" y="635" width="430" height="112" rx="10" fill="#039ACF"/><text x="805.0" y="689" fill="#FFFFFF" font-family="Microsoft YaHei" font-size="32" font-weight="700" text-anchor="middle"><tspan x="805.0" dy="0">文字回答 + Edge TTS</tspan></text><text x="1060" y="699" fill="#182B3B" font-family="Microsoft YaHei" font-size="28" font-weight="700" text-anchor="start"><tspan x="1060" dy="0">模型据查询结果生成回答</tspan></text><text x="90" y="816" fill="#182B3B" font-family="Microsoft YaHei" font-size="29" font-weight="400" text-anchor="start"><tspan x="90" dy="0">按钮：按住录音，松手发送。示例问题：“现在宿舍温湿度怎么样？”</tspan></text><text x="80" y="856" fill="#647584" font-family="Microsoft YaHei" font-size="22" font-weight="400" text-anchor="start"><tspan x="80" dy="0">交小西 DormSense</tspan></text><text x="1520" y="856" fill="#647584" font-family="Arial" font-size="22" font-weight="400" text-anchor="end"><tspan x="1520" dy="0">10 / 20</tspan></text></svg>