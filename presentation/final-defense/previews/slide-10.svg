<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="说一句话，交小西怎样找到答案"><image href="data:image/png;base64," x="0" y="0" width="1600" height="900"/><text x="158" y="106" fill="#182B3B" font-family="Microsoft YaHei" font-size="60" font-weight="700" text-anchor="start"><tspan x="158" dy="0">说一句话，交小西怎样找到答案</tspan></text><text x="82" y="193" fill="#647584" font-family="Microsoft YaHei" font-size="29" font-weight="400" text-anchor="start"><tspan x="82" dy="0">理解问题 → 调用工具读取数据 → 组织回答 → 播报。</tspan></text><rect x="80" y="260" width="250" height="165" rx="10" fill="#005AA6"/><text x="205.0" y="311" fill="#FFFFFF" font-family="Microsoft YaHei" font-size="29" font-weight="700" text-anchor="middle"><tspan x="205.0" dy="0">浏览器语音</tspan></text><text x="205.0" y="366" fill="#FFFFFF" font-family="Microsoft YaHei" font-size="26" font-weight="400" text-anchor="middle"><tspan x="205.0" dy="0">录音 / 实体按钮</tspan></text><path d="M336,342 L370,342" stroke="#005AA6" stroke-width="5" fill="none"/><path d="M370,342 L356.7946301614451,351.0342795743206" stroke="#005AA6" stroke-width="5" fill="none"/><path d="M370,342 L356.7946301614451,332.9657204256794" stroke="#005AA6" stroke-width="5" fill="none"/><rect x="380" y="260" width="250" height="165" rx="10" fill="#005AA6"/><text x="505.0" y="311" fill="#FFFFFF" font-family="Microsoft YaHei" font-size="29" font-weight="700" text-anchor="middle"><tspan x="505.0" dy="0">语音转文字</tspan></text><text x="505.0" y="366" fill="#FFFFFF" font-family="Microsoft YaHei" font-size="26" font-weight="400" text-anchor="middle"><tspan x="505.0" dy="0">转写接口</tspan></text><path d="M636,342 L670,342" stroke="#005AA6" stroke-width="5" fill="none"/><path d="M670,342 L656.7946301614452,351.0342795743206" stroke="#005AA6" stroke-width="5" fill="none"/><path d="M670,342 L656.7946301614452,332.9657204256794" stroke="#005AA6" stroke-width="5" fill="none"/><rect x="680" y="260" wid